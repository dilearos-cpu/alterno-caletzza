query CartInput {
  shop {
    metafield(namespace: "caletzza", key: "discount_rules") {
      jsonValue
    }
  }
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            handle
          }
        }
      }
    }
  }
  discount {
    discountClasses
  }
}
