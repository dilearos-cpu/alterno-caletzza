services:
  - type: web
    name: cod-express
    runtime: node
    rootDir: cod-express-app
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SHOPIFY_SHOP_DOMAIN
        value: tienda-dev-cuunda.myshopify.com
      - key: SHOPIFY_API_VERSION
        value: "2025-10"
      - key: PORT
        value: "3000"
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: DISCOUNT_FUNCTION_HANDLE
        value: quantity-discount
      # Opcional: solo si el lookup por handle falla. Preferir functionHandle en API 2025-10+.
      - key: DISCOUNT_FUNCTION_ID
        sync: false
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_SHOPIFY_GATEWAY_NAME
        value: Mercado Libre Express
